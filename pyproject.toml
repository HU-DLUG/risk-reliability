[project]
name = "risk-reliability"
version = "0.1.0"
description = "Course materials for Risk and Reliability"
readme = "README.md"
authors = [
    { name = "Masaru Kitahara", email = "kitahara@eng.hokudai.ac.jp" }
]
requires-python = ">=3.13,<3.14"
dependencies = [
    "marimo>=0.25.1",
    "matplotlib>=3.11.2",
    "numpy>=2.5.3",
    "scipy>=1.18.1",
]

[dependency-groups]
dev = [
    "ruff>=0.16.10",
]

[tool.basedpyright]
typeCheckingMode = "standard"
reportUnusedExpression = false

[tool.ruff.lint.per-file-ignores]
"notebooks/*.py" = ["B018"]
